[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tepa"
version = "0.1.3"
description = "Offline-first AI DevOps CLI for running, observing, and benchmarking SDLC workflows without cloud dependency."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tepa Tools" }
]
keywords = [
  "ai",
  "cli",
  "local-ai",
  "devops",
  "sdlc",
  "benchmarking",
  "automation"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: System :: Systems Administration"
]
dependencies = []

[project.urls]
Homepage = "https://tepa.tools"
Repository = "https://github.com/Tepa-Tools/tepa"
Issues = "https://github.com/Tepa-Tools/tepa/issues"

[project.scripts]
tepa = "tepa.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tepa*"]